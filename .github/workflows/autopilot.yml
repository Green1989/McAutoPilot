name: McAutoPilot Daily Run

# 每天北京时间 10:00（UTC 02:00）执行"午饭自动驾驶"循环：
# 感知 -> 决策 -> dry-run 算价草稿 -> 把决策日记 commit 回仓库（活仓库 = 连载）
# 说明：GitHub cron 高峰期可能延迟几分钟到几十分钟，10:00 发车给午饭决策留足缓冲。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write  # 决策日志自动 commit 回仓库

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autopilot
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          MCD_DRY_RUN: ${{ vars.MCD_DRY_RUN == 'false' && 'false' || 'true' }}
          MCD_BUDGET: ${{ vars.MCD_BUDGET || '40' }}
          MCD_PREVIEW: ${{ vars.MCD_PREVIEW || 'false' }}
          # v2 增量（默认值保持 v1 行为不变）：引擎切换 / 下单二次确认 / 自动领券
          MCD_ENGINE: ${{ vars.MCD_ENGINE || 'v1' }}
          MCD_CONFIRM_ORDER: ${{ vars.MCD_CONFIRM_ORDER || '' }}
          MCD_AUTO_CLAIM: ${{ vars.MCD_AUTO_CLAIM || 'false' }}
        run: python -m agent.main

      # mock 模式（无 Secret）不改动 DECISIONS.md，此步自动跳过
      - name: Commit decision diary
        run: |
          git config user.name "McAutoPilot Bot"
          git config user.email "actions@github.com"
          git add DECISIONS.md state/nutrition.json state/last-decision.json state/decision-history.json
          if git diff --cached --quiet; then
            echo "nothing to commit (mock mode or no change)"
          else
            MSG=$(cat state/commit-msg.txt 2>/dev/null || echo "🍱 McAutoPilot daily decision")
            git commit -m "$MSG"
            git push
          fi

      # 可选：今日决策卡推送到群机器人（企业微信/飞书/Discord/通用）。
      # 未配置 Secret 时静默跳过、退出码恒 0，绝不让流水线变红。
      - name: Push decision card (optional webhook)
        env:
          MCD_WEBHOOK_URL: ${{ secrets.MCD_WEBHOOK_URL }}
        run: python -m agent.notify
